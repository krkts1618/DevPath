<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevPath | Personal Engineering Tracker</title>
    <meta name="description" content="Personal Engineering Learning Tracker & Structured 126-Day Roadmaps. Track daily tasks, study sessions, and systems portfolio." />
    <meta name="theme-color" content="#244C3B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#222831" media="(prefers-color-scheme: dark)" />
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="DevPath | Personal Engineering Tracker" />
    <meta property="og:description" content="Structured curriculum tracks, adaptive daily planning, and deep-work study tracking for software engineers." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/devpath-logo.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Anti-flash theme script: runs before React renders -->
    <script>
      try {
        var params = new URLSearchParams(window.location.search);
        var qTheme = params.get('theme');
        var t = qTheme || localStorage.getItem('devpath-theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
